# Ejecutable local independiente. Al integrar, utilizar la configuración común del equipo.
server.port=8087
server.address=127.0.0.1
spring.application.name=modulo-elmer
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.datasource.url=${ELMER_DB_URL:jdbc:h2:file:./data/elmer}
spring.datasource.username=${ELMER_DB_USER:sa}
spring.datasource.password=${ELMER_DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:elmer-schema.sql
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
elmer.usuario=${ELMER_USUARIO:elmer}
elmer.clave=${ELMER_CLAVE:}
