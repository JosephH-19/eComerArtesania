<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taller Buendía - Login Administrador</title>

  <link rel="stylesheet" href="../../css/estilos.css">
</head>

<body>

  <header>
    <b>TALLER<br>BUENDÍA</b>
    <span>Taller Buendía - Textil Huanca</span>
  </header>

  <main class="login">

    <div class="login-box">

      <h1>INICIAR SESIÓN - ADMINISTRADOR</h1>

      <p>
        Ingrese sus credenciales para acceder a la zona de gestión.
      </p>

      <form action="../productos/productos.html">

        <div class="form-group">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" name="usuario" placeholder="Ingrese su usuario" required>
        </div>

        <div class="form-group">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" placeholder="Ingrese su contraseña" required>
        </div>

        <button type="submit" class="boton principal ancho">
          INICIAR SESIÓN
        </button>

      </form>
      <br>

      <a href="../../public/index.html">
        ← VOLVER A LA PÁGINA PRINCIPAL
      </a>

    </div>

  </main>

  <footer>
    <p>Taller Buendía - Zona de Gestión</p>
  </footer>

</body>
</html>
