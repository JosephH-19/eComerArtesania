<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taller Buendía - Login</title>

  <link rel="stylesheet" href="../../public/css/estilos.css">
</head>

<body>

  <header>
    <b>TALLER<br>BUENDÍA</b>
    <span>Taller Buendía - Textil Huanca</span>
  </header>

  <main class="login">

    <div class="login-box">

      <h1>INICIAR SESIÓN</h1>

      <p>
        Ingrese sus datos para acceder a la zona de gestión.
      </p>

      <form action="../productos/productos.html">

        <label>Usuario</label>
        <input type="text" placeholder="Ingrese su usuario"><br>
<br>
        <label>Contraseña</label>
        <input type="password" placeholder="Ingrese su contraseña"> <br>
<br>
        <button type="submit">
          INICIAR SESIÓN
        </button>

      </form>
      <br>

      <a href="../../public/index.html">
        VOLVER A LA PÁGINA PRINCIPAL
      </a>

    </div>

  </main>

  <footer>
    <p>Taller Buendía - Zona de Gestión</p>
  </footer>

</body>
</html>
