
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Taller Buendía - Editar Artesano</title>

  <link rel="stylesheet" href="../../public/css/estilos.css">
</head>

<body>

  <header>
    <b>TALLER<br>BUENDÍA</b>

    <span class="usuario">Usuario: Administrador</span>
  </header>

  <nav class="admin-nav">
    <a href="artesanos.html">ARTESANOS</a>
  </nav>

  <main>

    <h2>EDITAR ARTESANO</h2>

    <form class="formulario-admin">

      <label>Nombres</label>
      <input type="text" value="Juan">

      <label>Apellidos</label>
      <input type="text" value="Pérez">

      <label>Especialidad</label>
      <input type="text" value="Tejido tradicional">

      <label>Ubicación</label>
      <input type="text" value="Hualhuas, Huancayo">

      <label>Teléfono</label>
      <input type="text" value="999 999 999">

      <label>Estado</label>

      <select>
        <option>Activo</option>
        <option>Inactivo</option>
      </select>

      <div class="acciones-formulario">

        <a class="boton-secundario" href="artesanos.html">
          CANCELAR
        </a>

        <button type="submit">
          GUARDAR CAMBIOS
        </button>

      </div>

    </form>

  </main>

</html>
