
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Taller Buendía - Registrar Artesano</title>

  <link rel="stylesheet" href="../../public/css/estilos.css">
</head>

<body>

  <header>
    <b>TALLER<br>BUENDÍA</b>
    <span>Zona de Gestión</span>
    <span class="usuario">Usuario: Administrador</span>
  </header>

  <nav class="admin-nav">
    <a href="artesanos.html">ARTESANOS</a>
  </nav>

  <main>

    <h2>REGISTRAR ARTESANO</h2>

    <form class="formulario-admin">

      <label>Nombres</label>
      <input type="text" placeholder="Nombres">

      <label>Apellidos</label>
      <input type="text" placeholder="Apellidos">

      <label>Especialidad</label>
      <input type="text" placeholder="Especialidad artesanal">

      <label>Ubicación</label>
      <input type="text" placeholder="Lugar de trabajo">

      <label>Teléfono</label>
      <input type="text" placeholder="Teléfono">

      <label>Estado</label>

      <select>
        <option>Activo</option>
        <option>Inactivo</option>
      </select>

      <div class="acciones-formulario">

        <a class="boton-secundario" href="artesanos.html">
          CANCELAR
        </a>

        <button type="submit">
          GUARDAR ARTESANO
        </button>

      </div>

    </form>

  </main>

</body>
</html>
