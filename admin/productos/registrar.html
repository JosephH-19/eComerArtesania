<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taller Buendía - Registrar Producto</title>

  <link rel="stylesheet" href="../../css/estilos.css">
</head>

<body>

  <header>
    <b>TALLER<br>BUENDÍA</b>
    <span>Zona de Gestión</span>
    <span class="usuario">Usuario: Administrador</span>
    <a href="../login/login.html">CERRAR SESIÓN</a>
  </header>

  <nav class="admin-nav">
    <a href="../perfil/perfil.html">PERFIL</a>
    <a href="productos.html">PRODUCTOS</a>
    <a href="../categorias/categorias.html">CATEGORÍAS</a>
    <a href="../artesanos/artesanos.html">ARTESANOS</a>
    <a href="../clientes/clientes.html">CLIENTES</a>
    <a href="../promociones/promociones.html">DESCUENTOS</a>
    <a href="../pedidos/pedidos.html">PEDIDOS</a>
    <a href="../pagos/pagos.html">PAGOS</a>
    <a href="../metricas/metricas.html">MÉTRICAS</a>
  </nav>

  <main>

    <a href="productos.html">← Volver a Productos</a>

    <h2>REGISTRAR NUEVO PRODUCTO</h2>

    <form class="formulario-admin">

      <div class="form-section">
        <h3>Datos Básicos</h3>

        <div class="form-group">
          <label for="codigo">Código de Producto *</label>
          <input type="text" id="codigo" name="codigo" placeholder="Ej: PON-001" required>
        </div>

        <div class="form-group">
          <label for="nombre">Nombre *</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ej: Poncho Callhua" required>
        </div>

        <div class="form-group">
          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" name="descripcion" rows="3" placeholder="Descripción del producto..."></textarea>
        </div>

      </div>

      <div class="form-section">
        <h3>Información Comercial</h3>

        <div class="form-group">
          <label for="categoria">Categoría *</label>
          <select id="categoria" name="categoria" required>
            <option value="">Seleccionar categoría...</option>
            <option value="ponchos">Ponchos</option>
            <option value="mantas">Mantas</option>
            <option value="chalinas">Chalinas</option>
          </select>
        </div>

        <div class="form-group">
          <label for="precio">Precio *</label>
          <input type="number" id="precio" name="precio" step="0.01" min="0" placeholder="Ej: 75.00" required>
        </div>

        <div class="form-group">
          <label for="stock">Stock *</label>
          <input type="number" id="stock" name="stock" min="0" placeholder="Ej: 12" required>
        </div>

      </div>

      <div class="form-section">
        <h3>Asignación y Estado</h3>

        <div class="form-group">
          <label for="artesano">Artesano Responsable</label>
          <select id="artesano" name="artesano">
            <option value="">Seleccionar artesano...</option>
            <option value="jose">José Buendía</option>
            <option value="maria">María López</option>
            <option value="carlos">Carlos Gómez</option>
          </select>
        </div>

        <div class="form-group">
          <label for="estado">Estado *</label>
          <select id="estado" name="estado" required>
            <option value="">Seleccionar estado...</option>
            <option value="disponible" selected>Disponible</option>
            <option value="agotado">Agotado</option>
            <option value="bajo-pedido">Bajo Pedido</option>
          </select>
        </div>

        <div class="form-group">
          <label for="imagen">Imagen del Producto</label>
          <input type="file" id="imagen" name="imagen" accept="image/*">
        </div>

      </div>

      <div class="form-actions">
        <button type="submit" class="boton principal">REGISTRAR PRODUCTO</button>
        <button type="reset" class="boton">LIMPIAR FORMULARIO</button>
        <a href="productos.html" class="boton">CANCELAR</a>
      </div>

    </form>

  </main>

  <footer>
    <p>Taller Buendía - Zona de Gestión</p>
  </footer>

</body>
</html>
