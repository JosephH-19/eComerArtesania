
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Taller Buendía - Registrar Categoría</title>

  <link rel="stylesheet" href="../../public/css/estilos.css">
</head>

<body>

  <header>
    <b>TALLER<br>BUENDÍA</b>
    <span>Zona de Gestión</span>
    <span class="usuario">Usuario: Administrador</span>
  </header>

  <nav class="admin-nav">
    <a href="categorias.html">CATEGORÍAS</a>
  </nav>

  <main>

    <h2>REGISTRAR CATEGORÍA</h2>

    <form class="formulario-admin">

      <label>Nombre de la categoría</label>
      <input type="text" placeholder="Ejemplo: Textiles">

      <label>Descripción</label>
      <textarea placeholder="Descripción de la categoría"></textarea>

      <label>Estado</label>

      <select>
        <option>Activa</option>
        <option>Inactiva</option>
      </select>

      <div class="acciones-formulario">

        <a class="boton-secundario" href="categorias.html">
          CANCELAR
        </a>

        <button type="submit">
          GUARDAR CATEGORÍA
        </button>

      </div>

    </form>

  </main>

</body>
</html>
