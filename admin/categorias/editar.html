
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Taller Buendía - Editar Categoría</title>

  <link rel="stylesheet" href="../../public/css/estilos.css">
</head>

<body>

  <header>
    <b>TALLER<br>BUENDÍA</b>
    <span>Zona de Gestión</span>
    <span class="usuario">Usuario: Administrador</span>
  </header>

  <nav class="admin-nav">
    <a href="categorias.html">CATEGORÍAS</a>
  </nav>

  <main>

    <h2>EDITAR CATEGORÍA</h2>

    <form class="formulario-admin">

      <label>Nombre de la categoría</label>

      <input type="text" value="Textiles">

      <label>Descripción</label>

      <textarea>Productos elaborados con fibras y técnicas textiles.</textarea>

      <label>Estado</label>

      <select>
        <option>Activa</option>
        <option>Inactiva</option>
      </select>

      <div class="acciones-formulario">

        <a class="boton-secundario" href="categorias.html">
          CANCELAR
        </a>

        <button type="submit">
          GUARDAR CAMBIOS
        </button>

      </div>

    </form>

  </main>

</body>
</html>
