
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Taller Buendía - Editar Perfil</title>

  <link rel="stylesheet" href="../../public/css/estilos.css">
</head>

<body>

  <header>
    <b>TALLER<br>BUENDÍA</b>
    <span>Zona de Gestión</span>
    <span class="usuario">Usuario: Administrador</span>
  </header>

  <nav class="admin-nav">
    <a href="perfil.html">PERFIL</a>
  </nav>

  <main>

    <h2>EDITAR PERFIL</h2>

    <form class="formulario-admin">

      <label>Nombre</label>

      <input
        type="text"
        value="Administrador del sistema">

      <label>Correo</label>

      <input
        type="email"
        value="admin@tallerbuendia.com">

      <label>Contraseña actual</label>

      <input type="password">

      <label>Nueva contraseña</label>

      <input type="password">

      <label>Confirmar nueva contraseña</label>

      <input type="password">

      <div class="acciones-formulario">

        <a class="boton-secundario" href="perfil.html">
          CANCELAR
        </a>

        <button type="submit">
          GUARDAR CAMBIOS
        </button>

      </div>

    </form>

  </main>

</body>
</html>
