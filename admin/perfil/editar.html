
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taller Buendía - Editar Perfil</title>

  <link rel="stylesheet" href="../../css/estilos.css">
</head>

<body>

  <header>
    <b>TALLER<br>BUENDÍA</b>
    <span>Zona de Gestión</span>
    <span class="usuario">Usuario: Administrador</span>
    <a href="../login/login.html">CERRAR SESIÓN</a>
  </header>

  <nav class="admin-nav">
    <a href="../perfil/perfil.html">PERFIL</a>
    <a href="../productos/productos.html">PRODUCTOS</a>
    <a href="../categorias/categorias.html">CATEGORÍAS</a>
    <a href="../artesanos/artesanos.html">ARTESANOS</a>
    <a href="../clientes/clientes.html">CLIENTES</a>
    <a href="../promociones/promociones.html">DESCUENTOS</a>
    <a href="../pedidos/pedidos.html">PEDIDOS</a>
    <a href="../pagos/pagos.html">PAGOS</a>
    <a href="../metricas/metricas.html">MÉTRICAS</a>
  </nav>

  <main>

    <a href="perfil.html">← Volver a Perfil</a>

    <h2>EDITAR PERFIL</h2>

    <form class="formulario-admin">

      <div class="form-section">
        <h3>Datos del Usuario</h3>

        <div class="form-group">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" name="usuario" value="admin" readonly>
        </div>

        <div class="form-group">
          <label for="nombre">Nombre *</label>
          <input type="text" id="nombre" name="nombre" value="Administrador del sistema" required>
        </div>

        <div class="form-group">
          <label for="correo">Correo Electrónico *</label>
          <input type="email" id="correo" name="correo" value="admin@tallerbuendia.com" required>
        </div>

        <div class="form-group">
          <label for="rol">Rol</label>
          <input type="text" id="rol" name="rol" value="Administrador" readonly>
        </div>

      </div>

      <div class="form-section">
        <h3>Seguridad</h3>

        <div class="form-group">
          <label for="contrasena-actual">Contraseña Actual</label>
          <input type="password" id="contrasena-actual" name="contrasena-actual" placeholder="Ingrese su contraseña actual">
        </div>

        <div class="form-group">
          <label for="nueva-contrasena">Nueva Contraseña</label>
          <input type="password" id="nueva-contrasena" name="nueva-contrasena" placeholder="Ingrese nueva contraseña">
        </div>

        <div class="form-group">
          <label for="confirmar-contrasena">Confirmar Nueva Contraseña</label>
          <input type="password" id="confirmar-contrasena" name="confirmar-contrasena" placeholder="Confirme la nueva contraseña">
        </div>

      </div>

      <div class="form-actions">
        <button type="submit" class="boton principal">GUARDAR CAMBIOS</button>
        <button type="button" class="boton" onclick="window.location.href='perfil.html'">CANCELAR</button>
      </div>

    </form>

  </main>

  <footer>
    <p>Taller Buendía - Zona de Gestión</p>
  </footer>

</body>
</html>
