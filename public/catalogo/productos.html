<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller Buendía - Catálogo de Productos</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>

<!-- Encabezado superior -->
<header>
    <b>TALLER<br>BUENDÍA</b>
    <span>Taller Buendía - Textil Huanca</span>
    <!-- Ruta corregida hacia el login del admin para evitar el error 404 -->
    <a href="../../admin/login/login.html" class="enlace-ingreso">INGRESAR AL SISTEMA</a>
</header>

<!-- Menú de navegación principal (Cliente) -->
<nav class="nav-principal">
    <a href="../index.html">INICIO</a>
    <a href="../nosotros.html">NOSOTROS</a>
    <a href="productos.html" class="active">CATÁLOGO</a>
    <a href="carrito.html">CARRITO</a>
    <a href="../publicidad.html">PUBLICIDAD</a>
    <a href="../contacto/contacto.html">CONTACTO</a>
</nav>

<!-- Submenú de la sección Catálogo -->
<nav class="subnav-catalogo">
    <a href="productos.html" class="active">PRODUCTOS</a>
    <a href="detalle-producto.html">DETALLE DEL PRODUCTO</a>
    <a href="artesano.html">ARTESANO</a>
</nav>

<main>
    <aside>
        <h3>Filtros</h3>
        <label for="selectCategoria">Categoría:</label>
        <select id="selectCategoria">
            <!-- Se llena dinámicamente -->
        </select>
    </aside>

    <section>
        <h2>Nuestros Productos</h2>
        <div class="productos">
            <!-- Los productos se renderizan dinámicamente aquí -->
        </div>
    </section>
</main>

<footer>
    <p>Taller Buendía - Todos los derechos reservados</p>
</footer>

<script>
    const productosBase = [
        { id: 101, nombre: "Poncho Callhua", color: "Marrón", precio: 75.00, categoria: "Textiles", imagen: "../../assets/productos/8.jpg" },
        { id: 102, nombre: "Poncho Andino", color: "Blanco con Rojo", precio: 48.00, categoria: "Textiles", imagen: "../../assets/productos/6.jpg" },
        { id: 103, nombre: "Poncho Sicaino", color: "Blanco con Negro", precio: 35.00, categoria: "Textiles", imagen: "../../assets/productos/4.jpg" },
        { id: 104, nombre: "Vasija de Barro", color: "Marrón Oscuro", precio: 45.00, categoria: "Cerámica", imagen: "../../assets/productos/4.jpg" }
    ];

    const contenedorProductos = document.querySelector(".productos");
    const selectCategoria = document.getElementById("selectCategoria");

    function cargarCategoriasEnSelect() {
        const categoriasGuardadas = JSON.parse(localStorage.getItem("categorias")) || [
            { nombre: "Textiles" },
            { nombre: "Cerámica" },
            { nombre: "Madera" }
        ];

        const opcionesHTML = `<option value="Todos">Todos</option>` +
            categoriasGuardadas.map(cat => `<option value="${cat.nombre}">${cat.nombre}</option>`).join('');

        selectCategoria.innerHTML = opcionesHTML;
    }

    function renderizarProductos(lista) {
        if (lista.length === 0) {
            contenedorProductos.innerHTML = "<p>No hay productos disponibles en esta categoría.</p>";
            return;
        }

        contenedorProductos.innerHTML = lista.map(prod => `
        <article class="producto-card">
          <div class="producto-imagen">
            <img src="${prod.imagen}" alt="${prod.nombre}">
          </div>
          <div class="producto-contenido">
            <h3>${prod.nombre}</h3>
            <p>Color: ${prod.color}</p>
            <p class="precio">S/ ${prod.precio.toFixed(2)}</p>
            <div class="acciones-producto">
              <a href="detalle-producto.html?id=${prod.id}">VER</a>
              <button type="button">AGREGAR</button>
            </div>
          </div>
        </article>
      `).join('');
    }

    selectCategoria.addEventListener("change", (e) => {
        const seleccion = e.target.value;
        if (seleccion === "Todos") {
            renderizarProductos(productosBase);
        } else {
            const filtrados = productosBase.filter(prod => prod.categoria.toLowerCase() === seleccion.toLowerCase());
            renderizarProductos(filtrados);
        }
    });

    // Cargar al inicio
    cargarCategoriasEnSelect();
    renderizarProductos(productosBase);
</script>

</body>
</html>
